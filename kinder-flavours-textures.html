<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Kinder Bueno – Irresistibly Bueno</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: contain; display: block; background: #000; }
  #start {
    position: absolute; inset: 0; border: 0; padding: 0; cursor: pointer;
    background: #000 url("media/kinder-flavours-textures.jpg") center / cover no-repeat;
  }
  #start span {
    position: absolute; left: 50%; top: 50%; width: 84px; height: 84px; margin: -42px 0 0 -42px;
    border-radius: 50%; background: rgba(0, 0, 0, 0.45);
    transition: transform .2s ease, background .2s ease;
  }
  #start span::after {
    content: ""; position: absolute; left: 34px; top: 26px;
    border-style: solid; border-width: 16px 0 16px 26px; border-color: transparent transparent transparent #fff;
  }
  #start:hover span { transform: scale(1.08); background: rgba(0, 0, 0, 0.6); }
  #start:focus-visible span { outline: 3px solid #fff; outline-offset: 4px; }
  @media (max-width: 500px) { #start span { transform: scale(.75); } }
</style>
</head>
<body>
<video id="v" src="media/kinder-flavours-textures.mp4" poster="media/kinder-flavours-textures.jpg" playsinline loop preload="metadata"
  controlslist="nodownload noplaybackrate noremoteplayback" disablepictureinpicture
  oncontextmenu="return false;" aria-label="Kinder Bueno – Irresistibly Bueno"></video>
<button id="start" aria-label="Play video"><span></span></button>
<script>
  const v = document.getElementById('v'), b = document.getElementById('start');
  b.addEventListener('click', () => { b.remove(); v.controls = true; v.play(); });
</script>
</body>
</html>
